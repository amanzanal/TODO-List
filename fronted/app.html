<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Mis tareas</h1>
            <p>Organiza tus tareas de forma sencilla.</p>
        </header>

        <section class="task-form-section">

            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="¿Qué tienes que hacer?"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Añadir
                </button>

            </form>

        </section>

        <section class="tasks-section">

            <div class="tasks-header">
                <h2>Tareas</h2>

                <span id="taskCount">
                    0 tareas
                </span>
            </div>

            <p id="loading">
                Cargando tareas...
            </p>

            <p id="errorMessage" class="error hidden"></p>

            <ul id="taskList"></ul>

        </section>

    </main>

    <script src="./js/app.js"></script>

</body>
</html>
